services:
  inkling2-mini-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:inkling-2-mini}
    container_name: inkling2-mini-vllm
    pull_policy: if_not_present
    restart: unless-stopped
    stop_grace_period: 15s
    privileged: true
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - "${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface"
    environment:
      - HF_HUB_DISABLE_XET=1
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=${API_KEY:-}
    command:
      - ${MODEL_ID:-thinkingmachines/Inkling-2-Mini}
      - --host
      - "${HOST:-0.0.0.0}"
      - --port
      - "${PORT:-8000}"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-262144}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEM_UTIL:-0.85}"
      - --reasoning-parser
      - inkling
      - --enable-auto-tool-choice
      - --tool-call-parser
      - inkling
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-8000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 480s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
