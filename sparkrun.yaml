recipe_version: "2"
name: inkling-2-mini-vllm-dgx-spark
model: thinkingmachines/Inkling-2-Mini
runtime: vllm
container: vllm/vllm-openai:inkling-2-mini

metadata:
  description: "Thinking Machines Inkling-2-Mini (NVFP4/MXFP8) with DSpark speculative decoding on a single NVIDIA DGX Spark using vLLM"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144

env:
  HF_HUB_DISABLE_XET: "1"

extra_args:
  - --reasoning-parser
  - inkling
  - --enable-auto-tool-choice
  - --tool-call-parser
  - inkling
  - --speculative-config
  - '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
